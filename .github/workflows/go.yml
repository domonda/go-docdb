name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6.1.0

    - name: Set up Go
      uses: actions/setup-go@v6.5.0
      with:
        go-version: '1.26.5'

    - name: Build
      run: go build -v ./...

    - name: Test
      run: ./run_tests.sh
